name: Production CI/CD (v15)

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE_NAME: resumesphere-ai
  KUBERNETES_NAMESPACE: prod

jobs:
  code-quality:
    name: Code Quality & SAST
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit mypy
        
    - name: Run Flake8 (Linting)
      run: |
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Run Bandit (Static Security Testing)
      run: |
        bandit -r backend/ -c bandit.yaml || true
        
  test:
    name: Automated Testing
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install Pytest
      run: pip install pytest fastapi httpx sqlalchemy pydantic sentence-transformers
      
    - name: Run Security & Performance Tests
      run: |
        pytest backend/tests/test_security.py backend/tests/test_performance.py -v

  build-and-push:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t $DOCKER_IMAGE_NAME:${{ github.sha }} .
        docker tag $DOCKER_IMAGE_NAME:${{ github.sha }} $DOCKER_IMAGE_NAME:latest
        
    # In a real pipeline, we'd log into AWS ECR or Docker Hub and push here
    - name: Mock Push
      run: echo "Pushed $DOCKER_IMAGE_NAME:${{ github.sha }}"
