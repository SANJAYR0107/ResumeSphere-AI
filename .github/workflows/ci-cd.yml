name: ResumeSphere AI CI/CD Pipeline

on:
  push:
    branches: [ main, master, "v*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Test & Static Analysis (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mypy Static Type Verification
        run: |
          mypy backend

      - name: Run Pytest Test Suite
        run: |
          pytest -v

  docker-build-and-healthcheck:
    name: Docker Build & Container Health Validation
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: resumesphere-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker Container
        run: |
          docker run -d --name resumesphere_container -p 8000:8000 resumesphere-ai:test

      - name: Verify Application Health
        run: |
          # Wait up to 60 seconds for health check
          for i in {1..12}; do
            STATUS=$(curl -s http://localhost:8000/health | grep '"status":"ok"' || true)
            if [ -n "$STATUS" ]; then
              echo "Health check PASSED: $STATUS"
              exit 0
            fi
            echo "Waiting for container startup... attempt $i/12"
            sleep 5
          done
          echo "ERROR: Container failed health check!"
          docker logs resumesphere_container
          exit 1

      - name: Cleanup Container
        if: always()
        run: |
          docker stop resumesphere_container || true
          docker rm resumesphere_container || true
