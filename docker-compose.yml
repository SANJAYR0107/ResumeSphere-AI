version: '3.8'

services:
  resumesphere-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resumesphere_ai_app
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGINS=*
    volumes:
      - resumesphere_uploads:/app/backend/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  resumesphere_uploads:
    driver: local
