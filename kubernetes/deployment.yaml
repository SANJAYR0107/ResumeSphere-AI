apiVersion: v1
kind: ConfigMap
metadata:
  name: resumesphere-config
data:
  API_ENV: "production"
  DATABASE_URL: "postgresql://user:pass@db-host:5432/resumesphere"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumesphere-backend
  labels:
    app: resumesphere
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: resumesphere
      tier: backend
  template:
    metadata:
      labels:
        app: resumesphere
        tier: backend
    spec:
      containers:
      - name: fastapi-app
        image: resumesphere:v13.0.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: resumesphere-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: resumesphere-service
spec:
  type: ClusterIP
  selector:
    app: resumesphere
    tier: backend
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resumesphere-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: api.resumesphere.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: resumesphere-service
            port:
              number: 80
